<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#grad)" filter="url(#shadow)" />
  <!-- Certificate / Scroll Outline -->
  <rect x="14" y="14" width="36" height="26" rx="4" fill="#ffffff" fill-opacity="0.95" />
  <!-- Certificate Lines -->
  <line x1="20" y1="20" x2="36" y2="20" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="26" x2="44" y2="26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="31" x2="38" y2="31" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />
  <!-- Medal Seal -->
  <circle cx="32" cy="42" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
  <!-- Ribbon Tails -->
  <path d="M28 48 L25 56 L30 53 L32 56 L32 48" fill="#dc2626" />
  <path d="M36 48 L39 56 L34 53 L32 56 L32 48" fill="#b91c1c" />
  <!-- Star in Seal -->
  <polygon points="32,38 33.2,40.8 36.2,41.1 33.9,43 34.6,46 32,44.4 29.4,46 30.1,43 27.8,41.1 30.8,40.8" fill="#ffffff" />
</svg>
