<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Outer Squircle Rim Gradient -->
    <linearGradient id="squircleRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Luxurious Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Electric Cyan to Royal Blue -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Violet to Indigo -->
    <linearGradient id="violetIndigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Radial Shield Glow -->
    <radialGradient id="shieldInfill" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#0b1120" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#squircleRim)" stroke-width="2" opacity="0.8" />

  <!-- Background Subtle Tech Nodes & Geometric Rings -->
  <g opacity="0.2">
    <circle cx="256" cy="256" r="222" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5 7" />
    <circle cx="256" cy="256" r="192" fill="none" stroke="#818cf8" stroke-width="1" />
    <circle cx="256" cy="256" r="150" fill="none" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="4 8" />
  </g>

  <!-- Classical Botanical Laurel Wreath (Accreditation & Academic Honor) -->
  <g id="laurelWreath" filter="url(#goldGlow)">
    <!-- Central Ribbon Knot -->
    <path d="M 256, 420 C 248, 428 240, 436 244, 444 C 248, 450 256, 452 256, 452 C 256, 452 264, 450 268, 444 C 272, 436 264, 428 256, 420 Z" fill="url(#goldGrad)" />
    
    <!-- Left Laurel Branch -->
    <g>
      <!-- Leaf Pair 1 (Bottom) -->
      <path d="M 236, 426 C 218, 426 200, 420 190, 408 C 202, 404 220, 412 232, 422 Z" fill="url(#goldGrad)" />
      <path d="M 226, 432 C 208, 438 188, 434 176, 424 C 188, 416 208, 420 222, 428 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 2 -->
      <path d="M 184, 396 C 166, 392 148, 380 142, 364 C 154, 364 170, 376 180, 390 Z" fill="url(#goldGrad)" />
      <path d="M 172, 406 C 152, 408 134, 398 124, 384 C 138, 380 156, 388 168, 400 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 3 -->
      <path d="M 142, 350 C 126, 340 114, 324 112, 306 C 124, 310 136, 326 142, 344 Z" fill="url(#goldGrad)" />
      <path d="M 130, 362 C 112, 358 98, 344 92, 326 C 106, 326 120, 338 128, 354 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 4 -->
      <path d="M 116, 292 C 104, 278 98, 258 102, 240 C 112, 248 118, 268 118, 286 Z" fill="url(#goldGrad)" />
      <path d="M 104, 304 C 88, 294 80, 276 80, 258 C 94, 262 104, 278 106, 296 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 5 (Top Left) -->
      <path d="M 108, 230 C 102, 212 102, 192 112, 176 C 118, 188 120, 208 114, 226 Z" fill="url(#goldGrad)" />
      <path d="M 98, 238 C 86, 224 84, 204 90, 188 C 102, 196 106, 214 102, 232 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Top Terminal Leaf (Left) -->
      <path d="M 118, 172 C 118, 154 126, 138 140, 128 C 140, 144 136, 160 124, 172 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Right Laurel Branch (Mirrored) -->
    <g transform="translate(512, 0) scale(-1, 1)">
      <!-- Leaf Pair 1 (Bottom) -->
      <path d="M 236, 426 C 218, 426 200, 420 190, 408 C 202, 404 220, 412 232, 422 Z" fill="url(#goldGrad)" />
      <path d="M 226, 432 C 208, 438 188, 434 176, 424 C 188, 416 208, 420 222, 428 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 2 -->
      <path d="M 184, 396 C 166, 392 148, 380 142, 364 C 154, 364 170, 376 180, 390 Z" fill="url(#goldGrad)" />
      <path d="M 172, 406 C 152, 408 134, 398 124, 384 C 138, 380 156, 388 168, 400 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 3 -->
      <path d="M 142, 350 C 126, 340 114, 324 112, 306 C 124, 310 136, 326 142, 344 Z" fill="url(#goldGrad)" />
      <path d="M 130, 362 C 112, 358 98, 344 92, 326 C 106, 326 120, 338 128, 354 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 4 -->
      <path d="M 116, 292 C 104, 278 98, 258 102, 240 C 112, 248 118, 268 118, 286 Z" fill="url(#goldGrad)" />
      <path d="M 104, 304 C 88, 294 80, 276 80, 258 C 94, 262 104, 278 106, 296 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Leaf Pair 5 (Top Right) -->
      <path d="M 108, 230 C 102, 212 102, 192 112, 176 C 118, 188 120, 208 114, 226 Z" fill="url(#goldGrad)" />
      <path d="M 98, 238 C 86, 224 84, 204 90, 188 C 102, 196 106, 214 102, 232 Z" fill="url(#goldGrad)" opacity="0.9" />

      <!-- Top Terminal Leaf (Right) -->
      <path d="M 118, 172 C 118, 154 126, 138 140, 128 C 140, 144 136, 160 124, 172 Z" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Central Heraldic Academic Shield -->
  <g filter="url(#mainShadow)">
    <!-- Outer Shield Crest -->
    <path d="M 256, 126 
             C 342, 126 368, 160 368, 226 
             C 368, 320 286, 380 256, 404 
             C 226, 380 144, 320 144, 226 
             C 144, 160 170, 126 256, 126 Z"
          fill="url(#shieldInfill)"
          stroke="url(#shieldBorderGrad)"
          stroke-width="4.5"
          stroke-linejoin="round" />

    <!-- Inner Shield Inset Fine Stroke -->
    <path d="M 256, 138 
             C 332, 138 354, 168 354, 226 
             C 354, 310 280, 365 256, 388 
             C 232, 365 158, 310 158, 226 
             C 158, 168 180, 138 256, 138 Z"
          fill="none"
          stroke="#818cf8"
          stroke-width="1.2"
          opacity="0.4" />
  </g>

  <!-- Central Monogram 'S' Emblem (Precision Geometric Bezier Architecture) -->
  <g id="monogram" transform="translate(0, 12)">
    <!-- Shadow for Depth -->
    <path d="M 304, 190
             C 304, 164 282, 150 256, 150
             C 224, 150 204, 168 204, 194
             C 204, 230 256, 240 284, 252
             C 310, 264 322, 284 322, 310
             C 322, 342 296, 362 256, 362
             C 218, 362 196, 340 196, 312"
          fill="none"
          stroke="#050811"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.75" />

    <!-- Primary 'S' Ribbon -->
    <path d="M 304, 190
             C 304, 164 282, 150 256, 150
             C 224, 150 204, 168 204, 194
             C 204, 230 256, 240 284, 252
             C 310, 264 322, 284 322, 310
             C 322, 342 296, 362 256, 362
             C 218, 362 196, 340 196, 312"
          fill="none"
          stroke="url(#cyanBlueGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Upper Loop Overlap Gradient (Vibrant Violet to Cyan) -->
    <path d="M 304, 190
             C 304, 164 282, 150 256, 150
             C 224, 150 204, 168 204, 194
             C 204, 226 248, 238 274, 248"
          fill="none"
          stroke="url(#violetIndigoGrad)"
          stroke-width="26"
          stroke-linecap="round" />

    <!-- Dynamic Center Ribbon Glow Spine -->
    <path d="M 296, 190
             C 296, 170 278, 158 256, 158
             C 232, 158 214, 172 214, 194
             C 214, 224 262, 236 288, 248
             C 306, 258 312, 276 312, 310
             C 312, 334 290, 354 256, 354
             C 228, 354 206, 336 206, 312"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-linecap="round"
          opacity="0.6" />

    <!-- Central Diamond Star Accent inside the 'S' -->
    <g transform="translate(256, 256)" filter="url(#goldGlow)">
      <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Academic Mortarboard Perched on Shield Apex -->
  <g id="mortarboard" transform="translate(256, 102)" filter="url(#softGlow)">
    <!-- Cap Diamond Top -->
    <polygon points="0,-24 64,0 0,24 -64,0" fill="url(#cyanBlueGrad)" stroke="#67e8f9" stroke-width="2" />
    <!-- Light Reflection -->
    <line x1="-48" y1="-2" x2="0" y2="16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
    
    <!-- Skullcap Base -->
    <path d="M -36, 5 L -36, 17 C -36, 28 36, 28 36, 17 L 36, 5 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    
    <!-- Golden Apex Button & Flowing Ribbon Tassel -->
    <circle cx="0" cy="0" r="4.5" fill="url(#goldGrad)" />
    <path d="M 0, 0 C 30, 5 52, 14 56, 32" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="56" cy="34" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Accreditation 5-Star Arch at Base -->
  <g id="stars" transform="translate(256, 460)" filter="url(#goldGlow)">
    <!-- Center Star (Largest) -->
    <polygon points="0,-13 3.8,-4 13.5,-4 5.7,-0.4 8.3,9 0,3.6 -8.3,9 -5.7,-0.4 -13.5,-4 -3.8,-4" fill="url(#goldGrad)" />
    
    <!-- Left Star 1 -->
    <polygon transform="translate(-28, 2) scale(0.72)" points="0,-13 3.8,-4 13.5,-4 5.7,-0.4 8.3,9 0,3.6 -8.3,9 -5.7,-0.4 -13.5,-4 -3.8,-4" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Left Star 2 -->
    <polygon transform="translate(-54, 8) scale(0.55)" points="0,-13 3.8,-4 13.5,-4 5.7,-0.4 8.3,9 0,3.6 -8.3,9 -5.7,-0.4 -13.5,-4 -3.8,-4" fill="url(#goldGrad)" opacity="0.75" />

    <!-- Right Star 1 -->
    <polygon transform="translate(28, 2) scale(0.72)" points="0,-13 3.8,-4 13.5,-4 5.7,-0.4 8.3,9 0,3.6 -8.3,9 -5.7,-0.4 -13.5,-4 -3.8,-4" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Right Star 2 -->
    <polygon transform="translate(54, 8) scale(0.55)" points="0,-13 3.8,-4 13.5,-4 5.7,-0.4 8.3,9 0,3.6 -8.3,9 -5.7,-0.4 -13.5,-4 -3.8,-4" fill="url(#goldGrad)" opacity="0.75" />
  </g>
</svg>
